[package]
name = "mini-webflare"
version = "0.1.0"
edition = "2024"
dotenvy = "0.15"

[[bin]]
name = "mini-webflare"
path = "api/main.rs"

[lib]
path = "lib/mod.rs"

[dependencies]
actix-web = "4"
jsonwebtoken = "9"
axum = { version = "0.6", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros", "chrono"] }
dotenvy = "0.15.7"
bcrypt = "0.15"
bigdecimal = "0.4"
serde_with = "3.18.0" 
